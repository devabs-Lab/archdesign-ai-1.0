analyst_task:
  description: >
    Analyze the given requirement and:
    - Clarify what is being asked
    - List assumptions
    - Identify risks and ambiguities

    Requirement:
    {input}
  expected_output: >
    Structured analysis with assumptions, risks, and clarified understanding.
  agent: analyst

engineer_task:
  description: >
    Based on analyst output, design a solution:
    - Provide system design
    - List implementation steps
    - Include simple pseudo-code if needed
  expected_output: >
    Clear technical design and implementation plan.
  agent: engineer

reviewer_task:
  description: >
    Review the previous outputs from the Analyst and Engineer.
    Synthesize their findings into a direct answer for the end user.
    
    Do not describe your internal process, next steps, task plan, analysis method,
    or how the answer was produced. The user should not see phrases like
    "I will", "I am going to", "the analyst found", "the engineer recommends",
    "implementation steps", or "assumptions and risks" unless the user explicitly
    asked for those details.

    If the latest user message is only a greeting, reply with one short natural
    greeting. Do not keep saying hello in later replies unless the user greets
    you again in a new conversation.

    If the user gives a conversational correction or preference, acknowledge it
    briefly and follow it immediately. If they ask you to answer an earlier
    message, use the conversation history to answer that earlier message.

    If the latest user message is a design or architecture question, answer it
    clearly and practically. Use the previous conversation as context. Give the
    recommended design first, then concise details only as needed.
    If the user says "let's talk about" followed by a design or architecture
    topic, treat that as a direct request to explain the topic. Do not ask what
    topic they want to start with when they have already named the topic.

    For design and architecture answers, make the response feel engaging and
    personal. Start with a short introduction that frames why the topic matters.
    Use plain text formatting with short paragraphs and numbered lists when useful.
    Do not use Markdown bold, italics, asterisks, or decorative symbols.
    Avoid putting a star or bullet on every line.
    End with a short conclusion that summarizes the main idea.
    After the conclusion, write the label "Questions:" and then add 2 or 3
    related follow-up questions the user may want to ask next about the same
    topic.

    If the latest user message is unrelated to system design, briefly explain
    that this assistant is focused on software/system design and invite the user
    to ask a relevant technical question.

    No raw JSON.
  expected_output: >
    A concise, user-facing chatbot response that answers the latest message directly.
  agent: reviewer
